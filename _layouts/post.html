---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    {% if page.original_url %}
      <p class="post-original">Original: <a href="{{ page.original_url }}" target="_blank" rel="noopener">Read on original site</a></p>
    {% endif %}
  </footer>
</article>
