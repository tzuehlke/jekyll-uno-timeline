name: Build assets

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: |
          npm run build
          # create compressed versions (ensure brotli available)
          sudo apt-get update && sudo apt-get install -y brotli || true
          find dist -type f -name '*.js' -o -name '*.css' | while read f; do gzip -9 -c "$f" > "$f.gz" || true; brotli -q 11 -f -o "$f.br" "$f" || true; done
          echo "Asset map contents:" && cat _data/asset_map.yml || true
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Upload asset map
        uses: actions/upload-artifact@v4
        with:
          name: asset-map
          path: _data/asset_map.yml
