name: Lighthouse CI (basic)

on:
  push:
    branches: [ master ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install lhci
        run: npm install -g @lhci/cli@0.11
      - name: Run LHCI collect
        run: |
          npx lhci autorun --collect.url=https://mvelinamli.github.io || true
      - name: Save audit results
        run: mkdir -p audit && cp -r .lighthouseci/* audit/ || true
